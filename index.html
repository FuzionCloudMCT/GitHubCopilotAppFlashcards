<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>GitHub Copilot app flashcards</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <h1>GitHub Copilot app flashcards</h1>
    <p>Pick a topic, choose a question, then click it to reveal the answer. Cards flip back after one minute.</p>
  </header>
  <main>
    <div role="tablist" aria-label="Topics" id="tabs"></div>
    <div id="panels"></div>
    <noscript>This app needs JavaScript enabled.</noscript>
  </main>
</body>
</html>
